[platformio]
default_envs = m5stack-atom

[env:m5stack-atom]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
upload_speed = 460800

[env:m5stack-atom-relay]
extends = env:m5stack-atom
build_flags = -DTHERMIQ_ENABLE_RELAY
