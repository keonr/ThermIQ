server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # This listener is the public boundary. Every upstream path is explicit.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /api/access {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"read_only":true}';
    }

    location = /api/v1/telemetry {
        proxy_pass http://api:8000/api/v1/telemetry;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/view/active-cook {
        proxy_pass http://api:8000/api/v1/view/active-cook;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
